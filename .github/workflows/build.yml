name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK (ARM32 only)
        working-directory: MiracastReceiver
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PbuildArm32 --stacktrace

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: miracast-debug-arm32
          path: MiracastReceiver/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Build Release APK (ARM32, unsigned)
        if: false   # 需要签名才能安装，默认关闭
        working-directory: MiracastReceiver
        run: ./gradlew assembleRelease -PbuildArm32
