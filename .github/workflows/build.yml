name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      render_probe:
        description: Build a separately installable render-clock hardware test
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runner 已自带 Android SDK，不需要 setup-android action
      # （它会尝试安装已废弃的 'tools' 包并失败）
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and Debug APK (ARM32)
        working-directory: MiracastReceiver
        env:
          RENDER_PROBE: ${{ inputs.render_probe }}
        run: |
          chmod +x gradlew
          extra=()
          if [[ "$RENDER_PROBE" == "true" ]]; then
            extra+=("-PrenderClockProbe=true")
          fi
          ./gradlew testDebugUnitTest assembleDebug -PbuildArm32 "${extra[@]}" --no-daemon --stacktrace

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miracast-unit-test-results
          path: MiracastReceiver/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: miracast-debug-arm32
          path: MiracastReceiver/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
