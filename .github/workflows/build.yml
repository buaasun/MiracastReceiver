name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      compatibility_test_package:
        description: '使用独立兼容测试包名，保留电视原安装和数据'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ARM32 (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [uxplay, kotlin]
    env:
      AIRPLAY_BACKEND: ${{ matrix.backend }}
      COMPAT_TEST_PACKAGE: ${{ github.event.inputs.compatibility_test_package || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runner 已自带 Android SDK，不需要 setup-android action
      # （它会尝试安装已废弃的 'tools' 包并失败）
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and Debug/Release APKs (ARM32)
        working-directory: MiracastReceiver
        run: |
          chmod +x gradlew
          args=(-PbuildArm32)
          if [[ "$AIRPLAY_BACKEND" == "uxplay" ]]; then
            args+=(-PuseUxPlay)
          fi
          if [[ "$COMPAT_TEST_PACKAGE" == "true" ]]; then
            args+=(-PcompatibilityTestPackage)
          fi
          ./gradlew testDebugUnitTest assembleDebug assembleRelease "${args[@]}" --no-daemon --stacktrace

      - name: Verify APK identity and backend libraries
        working-directory: MiracastReceiver
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path

          backend = os.environ['AIRPLAY_BACKEND']
          native = backend == 'uxplay'
          test_package = os.environ.get('COMPAT_TEST_PACKAGE') == 'true'
          application_id = 'top.jast.miracastreceiver' + ('.compat' if test_package else '')
          build_tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'
          aapt = build_tools / 'aapt'
          apks = sorted(Path('app/build/outputs/apk').glob('*/*.apk'))
          assert len(apks) == 2, f'Expected debug and release APKs, got {apks}'
          records = []
          for apk in apks:
              badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
              assert f"package: name='{application_id}'" in badging, badging
              assert f"sdkVersion:'{23 if native else 21}'" in badging, badging
              with zipfile.ZipFile(apk) as archive:
                  libraries = {name for name in archive.namelist() if name.startswith('lib/') and name.endswith('.so')}
                  assert libraries and all(name.startswith('lib/armeabi-v7a/') for name in libraries)
                  expected = {'libairplay_native.so', 'libcrypto.so', 'liboboe.so', 'libc++_shared.so'}
                  for name in expected:
                      entry = f'lib/armeabi-v7a/{name}'
                      if native:
                          assert entry in libraries, f'{apk}: missing {name}'
                      elif name == 'libairplay_native.so':
                          assert entry not in libraries, f'{apk}: UxPlay included in Kotlin build'
                  for name in libraries:
                      elf = archive.read(name)
                      assert elf[:5] == b'\x7fELF\x01' and int.from_bytes(elf[18:20], 'little') == 40, name
              certificate_sha256 = None
              if apk.parent.name == 'debug':
                  signature = subprocess.check_output([str(build_tools / 'apksigner'), 'verify', '--print-certs', str(apk)], text=True)
                  match = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', signature)
                  assert match, signature
                  certificate_sha256 = match.group(1).lower()
              records.append({'file': apk.name, 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
                              'signerCertificateSha256': certificate_sha256})
          output = Path('app/build/ci-provenance')
          output.mkdir(parents=True, exist_ok=True)
          metadata = {
              'commit': os.environ['GITHUB_SHA'],
              'backend': backend,
              'applicationId': application_id,
              'compatibilityTestPackage': test_package,
              'abi': 'armeabi-v7a',
              'apks': records,
              'nativeSource': 'https://github.com/weekdayjast/MiracastReceiver/releases/download/v1.2.15/uxplay-native-source-v1.2.15.tar.gz' if native else None,
          }
          (output / 'build-info.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(json.dumps(metadata, indent=2))
          PY
          git archive --format=tar.gz -o app/build/ci-provenance/application-source.tar.gz HEAD

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miracast-unit-test-results-${{ matrix.backend }}
          path: MiracastReceiver/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: miracast-debug-arm32-${{ matrix.backend }}
          path: MiracastReceiver/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload ARM32 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: miracast-release-arm32-${{ matrix.backend }}
          path: MiracastReceiver/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload source and provenance
        uses: actions/upload-artifact@v4
        with:
          name: miracast-source-and-provenance-${{ matrix.backend }}
          path: |
            MiracastReceiver/app/build/ci-provenance/*
            MiracastReceiver/app/src/uxplay/NOTICE.md
            MiracastReceiver/app/src/uxplay/BUILDING.md
            MiracastReceiver/app/src/uxplay/LICENSE.android-airplay-server
          if-no-files-found: error
